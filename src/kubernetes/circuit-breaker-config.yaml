apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: monolith-dr
  namespace: cinemaabyss
spec:
  host: monolith.cinemaabyss.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp: { maxConnections: 1 }
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: monolith-vs
  namespace: cinemaabyss
spec:
  hosts: [ monolith.cinemaabyss.svc.cluster.local ]
  http:
    - timeout: 2s
      retries: { attempts: 2, perTryTimeout: 1s }
      route:
        - destination: { host: monolith.cinemaabyss.svc.cluster.local }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: movies-dr
  namespace: cinemaabyss
spec:
  host: movies-service.cinemaabyss.svc.cluster.local
  trafficPolicy:
    connectionPool:
      tcp: { maxConnections: 1 }
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: movies-vs
  namespace: cinemaabyss
spec:
  hosts: [ movies-service.cinemaabyss.svc.cluster.local ]
  http:
    - match: [ { uri: { prefix: /api/movies } } ]
      timeout: 2s
      retries: { attempts: 2, perTryTimeout: 1s }
      route:
        - destination: { host: movies-service.cinemaabyss.svc.cluster.local }
 