# Учётные данные для pull образов с ghcr.io (отдельный Secret типа kubernetes.io/dockerconfigjson).
# Замените REPLACE_* на deploy token или логин GitHub перед применением, либо создайте secret через kubectl:
# kubectl create secret docker-registry ghcr-registry-pull-secret \
#   --docker-server=ghcr.io --docker-username=<user> --docker-password=<token> -n cinemaabyss
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-registry-pull-secret
  namespace: cinemaabyss
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "REPLACE_WITH_GITHUB_USERNAME_OR_DEPLOY_TOKEN_NAME",
          "password": "REPLACE_WITH_TOKEN_OR_PASSWORD",
          "email": "not-used@example.com"
        }
      }
    }
