# Учётные данные для pull образов с gitlab.akhcheck.ru (отдельный Secret типа kubernetes.io/dockerconfigjson).
# Замените REPLACE_* на deploy token или логин GitLab перед применением, либо создайте secret через kubectl:
# kubectl create secret docker-registry gitlab-registry-pull-secret \
#   --docker-server=gitlab.akhcheck.ru --docker-username=<user> --docker-password=<token> -n cinemaabyss
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry-pull-secret
  namespace: cinemaabyss
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "gitlab.akhcheck.ru": {
          "username": "REPLACE_WITH_GITLAB_USERNAME_OR_DEPLOY_TOKEN_NAME",
          "password": "REPLACE_WITH_TOKEN_OR_PASSWORD",
          "email": "not-used@example.com"
        }
      }
    }
