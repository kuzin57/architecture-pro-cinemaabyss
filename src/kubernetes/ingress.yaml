apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cinemaabyss-ingress
  namespace: cinemaabyss
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "false"
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: cinemaabyss.example.com
      http:
        paths:
          # Прямые маршруты к events-service для тестирования создания событий (должны быть выше общего маршрута)
          - path: /api/events/health
            pathType: Exact
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          - path: /api/events/movie
            pathType: Exact
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          - path: /api/events/user
            pathType: Exact
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          - path: /api/events/payment
            pathType: Exact
            backend:
              service:
                name: events-service
                port:
                  number: 8082
          
          # Основной маршрут через proxy-service (API Gateway) - все остальные запросы идут через Kong
          # Этот маршрут обрабатывает:
          # - /health - health check Kong
          # - /api/users - монолит (GET, POST)
          # - /api/payments - монолит (GET, POST)
          # - /api/subscriptions - монолит (GET, POST)
          # - /api/movies - монолит или movies-service через feature flag (GET, POST)
          # - /api/movies/health - movies-service (GET)
          # - /api/events/* - события через Kong (если не перехвачены прямыми маршрутами выше)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: proxy-service
                port:
                  number: 8000
